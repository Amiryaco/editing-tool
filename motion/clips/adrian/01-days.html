<title>A01 Tuesday to Friday</title>
<style>html.alpha #shape{box-shadow:inset 0 0 0 1.5px rgba(201,162,77,.55)}
.ch{position:absolute;top:26px;width:170px;height:56px;border-radius:28px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;letter-spacing:.14em}
.st{position:absolute;left:-390px;top:104px;width:780px;text-align:center;font-size:40px;font-weight:600;color:#F5F1E8;white-space:nowrap;letter-spacing:-.01em}</style>
<div data-slot="shape">
  <div class="L" id="Ld">
    <div class="ch" id="c0" style="left:-364px">TUE</div><div class="ch" id="c1" style="left:-178px">WED</div>
    <div class="ch" id="c2" style="left:8px">THU</div><div class="ch" id="c3" style="left:194px">FRI</div>
    <div class="st" id="s0">The fight.</div><div class="st" id="s1">Quiet. Short answers.</div>
    <div class="st" id="s2">Still nothing.</div><div class="st" id="s3">“Hey, want to grab dinner?”</div>
    <div class="st" id="s4" style="color:#E2C27A">Like nothing happened.</div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
// local word times (clip in at 11.15): Tuesday 0.15, Wednesday 1.07, Thursday 3.67, Friday 8.84, hey 9.71, "Like nothing happened" 11.43
const DAY=[0.15,1.07,3.67,8.84], ST=[0.15,1.07,3.67,9.71,11.43];
const mix=(a,b,k)=>`rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*k)).join(',')})`;
const MUTED=[110,104,94], IVORY=[245,241,232], BLACK=[11,11,12];
M.scene({
  W:1080,H:1920,bg:null,T:12.45,intro:0.1,center:[540,260],
  SH:{d:{w:800,h:188,r:44,bg:'#0B0B0C',cam:1}}, start:'d', SEQ:[],
  layers:[{el:'Ld',tin:0.1,tout:null,anchor:'t',update:(t)=>{
    for(let i=0;i<4;i++){
      const on=M.eio(M.clamp((t-DAY[i])/0.22)), off=i<3?M.eio(M.clamp((t-DAY[i+1])/0.22)):0, a=on*(1-off), c=$('c'+i).style;
      c.background=`rgba(201,162,77,${a.toFixed(3)})`;
      c.color=a>0.5?mix(IVORY,BLACK,a):mix(MUTED,IVORY,on);
      c.border=`1.5px solid rgba(245,241,232,${(0.16*(1-a)).toFixed(3)})`;
      c.transform=`scale(${1+0.06*Math.sin(Math.PI*M.clamp((t-DAY[i])/0.3))})`;
    }
    for(let i=0;i<5;i++) M.apply($('s'+i),M.vis(t,ST[i],i<4?ST[i+1]:null,{din:0.05,lin:0.22}));
  }}],
});
</script>
