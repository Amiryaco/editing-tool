<script>
const $=id=>document.getElementById(id);
// local: "three" 0.09, Like 0.79, Save 3.19, share 6.73
const CLK=[0.85,3.25,6.8], on=CLK.map(c=>M.track(0,[[c,1,[20,0.78]]]));
const lerpC=(a,b,k)=>`rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*k)).join(',')})`;
const CREAM=[243,236,223], DIM=[120,112,104], GOLD=[201,164,92];
M.scene({
  W:1080,H:1920,bg:null,T:8.9,intro:0.09,center:[540,1100],
  SH:{b:{w:740,h:118,r:59,bg:'#15121B',cam:1}}, start:'b', SEQ:[],
  layers:[{el:'Lt',tin:0.09,tout:null,update:(t)=>{
    for(let i=0;i<3;i++){const k=M.clamp(on[i](t)), c=lerpC(DIM,GOLD,k);
      const p=$('p'+i); p.setAttribute('stroke',c); p.setAttribute('fill',i==2?'none':`rgba(201,164,92,${k})`);
      if(i==2) $('q2').setAttribute('stroke',c);
      $('t'+i).style.color=lerpC(DIM,CREAM,k);
      $('i'+i).style.transform=`scale(${1+0.12*Math.sin(Math.PI*M.clamp((t-CLK[i])/0.3))})`;}
  }}],
  cursor:{size:42,clicks:CLK,keys:[[0,-150,160],[0.55,-250,20],[0.9,-250,20],[2.9,-25,20],[3.3,-25,20],[6.4,205,20],[6.85,205,20],[8.9,240,120]]},

</script>
